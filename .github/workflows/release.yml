name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # cache: 'npm'  # Disabled until package-lock.json is committed

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify templates and package mirror
        run: npm run verify

      - name: Publish CLI, library, and MCP binary
        run: npm publish --workspace=@intentsolutions/blueprint --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            # Install CLI globally
            npm install -g @intentsolutions/blueprint

            # Or use directly with npx
            npx @intentsolutions/blueprint init
            ```

            ## MCP Server

            Add to any stdio MCP client:
            ```json
            {
              "mcpServers": {
                "blueprint": {
                  "type": "stdio",
                  "command": "npx",
                  "args": ["-y", "--package", "@intentsolutions/blueprint@2.9.0", "blueprint-mcp"]
                }
              }
            }
            ```
